<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Latest Singles">
  <defs>
    <linearGradient id="sigG" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#9c4dff"/>
      <stop offset="50%" stop-color="#ff2e63"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff2e63" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="900" height="300" fill="#fff7ef"/>

  <!-- Thick swash underline behind text -->
  <path d="M 60 220 C 200 190, 400 260, 600 200 S 800 180, 860 210"
        fill="none" stroke="url(#sigG)" stroke-width="14" stroke-linecap="round" opacity="0.35"/>

  <!-- Big italic wordmark -->
  <text x="450" y="180" text-anchor="middle"
        font-family="'Space Grotesk','Inter',sans-serif" font-weight="700" font-style="italic"
        font-size="128" letter-spacing="-6"
        fill="url(#sigG)"
        filter="url(#drop)">Latest Singles</text>

  <!-- Tiny "est." tag under the swash -->
  <g transform="translate(450 260)">
    <text text-anchor="middle"
          font-family="'Inter',sans-serif" font-weight="600" font-size="16" letter-spacing="10"
          fill="#1a1524" opacity="0.7">EST · MMXXVI · NEW HEAT</text>
  </g>

  <!-- Left accent star -->
  <g transform="translate(90 130)" fill="url(#sigG)">
    <path d="M 0 -22 L 6 -6 L 22 0 L 6 6 L 0 22 L -6 6 L -22 0 L -6 -6 Z"/>
  </g>
  <!-- Right accent star -->
  <g transform="translate(810 130)" fill="url(#sigG)">
    <path d="M 0 -22 L 6 -6 L 22 0 L 6 6 L 0 22 L -6 6 L -22 0 L -6 -6 Z"/>
  </g>
</svg>
