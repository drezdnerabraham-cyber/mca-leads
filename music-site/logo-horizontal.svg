<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160" role="img" aria-label="Latest Singles">
  <defs>
    <linearGradient id="lsGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9c4dff"/>
      <stop offset="50%" stop-color="#ff2e63"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="lsGradSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2e63"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon: circle with animated-looking sound-wave bars -->
  <g transform="translate(80, 80)">
    <circle r="60" fill="url(#lsGrad)" filter="url(#glow)"/>
    <circle r="60" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
    <!-- 5 sound wave bars -->
    <g fill="#fff">
      <rect x="-32" y="-10" width="8"  height="20" rx="4"/>
      <rect x="-18" y="-22" width="8"  height="44" rx="4"/>
      <rect x="-4"  y="-32" width="8"  height="64" rx="4"/>
      <rect x="10"  y="-20" width="8"  height="40" rx="4"/>
      <rect x="24"  y="-8"  width="8"  height="16" rx="4"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="170" y="82"
        font-family="'Space Grotesk', 'Inter', system-ui, sans-serif"
        font-weight="700"
        font-size="52"
        letter-spacing="-1.5"
        fill="url(#lsGrad)">Latest Singles</text>

  <!-- Tagline dot + text -->
  <g transform="translate(170, 118)">
    <circle cx="6" cy="0" r="4" fill="url(#lsGradSoft)"/>
    <text x="20" y="5"
          font-family="'Inter', system-ui, sans-serif"
          font-weight="600"
          font-size="14"
          letter-spacing="4"
          fill="#4a4358">NEW HEAT. STRAIGHT FROM THE STUDIO.</text>
  </g>
</svg>
