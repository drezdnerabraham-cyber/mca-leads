<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Latest Singles">
  <defs>
    <linearGradient id="sqGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#9c4dff"/>
      <stop offset="45%"  stop-color="#ff2e63"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="sqGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded gradient background -->
  <rect width="512" height="512" rx="112" fill="url(#sqGrad)"/>
  <rect width="512" height="512" rx="112" fill="url(#sqGlow)"/>

  <!-- Sound wave bars -->
  <g fill="#ffffff" transform="translate(256, 256)">
    <rect x="-140" y="-42" width="28" height="84"  rx="14"/>
    <rect x="-96"  y="-92" width="28" height="184" rx="14"/>
    <rect x="-52"  y="-132" width="28" height="264" rx="14"/>
    <rect x="-8"   y="-160" width="28" height="320" rx="14"/>
    <rect x="36"   y="-132" width="28" height="264" rx="14"/>
    <rect x="80"   y="-92"  width="28" height="184" rx="14"/>
    <rect x="124"  y="-42"  width="28" height="84"  rx="14"/>
  </g>

  <!-- Play triangle overlay for that "music" feel -->
  <g transform="translate(256, 420)" opacity="0.95">
    <circle r="34" fill="#fff"/>
    <path d="M -10 -14 L 16 0 L -10 14 Z" fill="url(#sqGrad)"/>
  </g>
</svg>
