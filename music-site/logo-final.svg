<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Latest Singles">
  <defs>
    <!-- Pastel circle gradient background -->
    <radialGradient id="bgG" cx="0.4" cy="0.35" r="0.9">
      <stop offset="0%"  stop-color="#ffd6e0"/>
      <stop offset="35%" stop-color="#e5c4e8"/>
      <stop offset="70%" stop-color="#b6d5da"/>
      <stop offset="100%" stop-color="#a7c9d1"/>
    </radialGradient>
    <!-- Purple music note gradient -->
    <linearGradient id="noteG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#a874d6"/>
      <stop offset="100%" stop-color="#7b4fb8"/>
    </linearGradient>
    <!-- Teal text -->
    <linearGradient id="textG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#7dd4de"/>
      <stop offset="100%" stop-color="#4bb5c2"/>
    </linearGradient>
    <!-- Coral outer ring -->
    <linearGradient id="ringG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#e74c5f"/>
      <stop offset="50%" stop-color="#ef5b6e"/>
      <stop offset="100%" stop-color="#c93e50"/>
    </linearGradient>
    <!-- Soft drop shadow on note -->
    <filter id="noteShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="4" dy="6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Pink glow behind text -->
    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feColorMatrix in="b" values="0 0 0 0 0.914  0 0 0 0 0.302  0 0 0 0 0.478  0 0 0 0.85 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Transparent canvas backdrop -->
  <rect width="640" height="640" fill="#fff7ef"/>

  <!-- Outer coral ring -->
  <circle cx="320" cy="320" r="290" fill="none" stroke="url(#ringG)" stroke-width="14"/>
  <circle cx="320" cy="320" r="290" fill="none" stroke="#7dd4de" stroke-width="3" opacity="0.6"/>

  <!-- Pastel gradient interior -->
  <circle cx="320" cy="320" r="278" fill="url(#bgG)"/>

  <!-- Purple beamed music note -->
  <g filter="url(#noteShadow)">
    <!-- Stem 1 -->
    <rect x="215" y="140" width="20" height="330" rx="4" fill="url(#noteG)"/>
    <!-- Stem 2 -->
    <rect x="405" y="140" width="20" height="330" rx="4" fill="url(#noteG)"/>
    <!-- Top beam (thicker) -->
    <path d="M 215 140 Q 320 105 425 140 L 425 175 Q 320 140 215 175 Z" fill="url(#noteG)"/>
    <!-- Second beam -->
    <path d="M 215 200 Q 320 175 425 200 L 425 230 Q 320 205 215 230 Z" fill="url(#noteG)"/>
    <!-- Note head 1 (left, bottom) -->
    <ellipse cx="205" cy="470" rx="42" ry="30" transform="rotate(-20 205 470)" fill="url(#noteG)"/>
    <!-- Note head 2 (right, bottom) -->
    <ellipse cx="415" cy="470" rx="42" ry="30" transform="rotate(-20 415 470)" fill="url(#noteG)"/>
  </g>

  <!-- Small extra note bottom-left as accent -->
  <g opacity="0.7">
    <rect x="130" y="440" width="10" height="80" rx="3" fill="#7dd4de"/>
    <ellipse cx="126" cy="522" rx="18" ry="13" transform="rotate(-20 126 522)" fill="#7dd4de"/>
    <path d="M 140 440 Q 165 430 165 455 Q 165 468 140 458 Z" fill="#7dd4de"/>
  </g>

  <!-- Text: "Latest Singles" — teal fill, pink outline glow -->
  <g filter="url(#textGlow)">
    <text x="320" y="308" text-anchor="middle"
          font-family="'Space Grotesk','Georgia',serif" font-style="italic" font-weight="700"
          font-size="82" letter-spacing="-2"
          fill="url(#textG)"
          stroke="#e94f7a" stroke-width="2" paint-order="stroke">Latest</text>
    <text x="320" y="405" text-anchor="middle"
          font-family="'Space Grotesk','Georgia',serif" font-style="italic" font-weight="700"
          font-size="82" letter-spacing="-2"
          fill="url(#textG)"
          stroke="#e94f7a" stroke-width="2" paint-order="stroke">Singles</text>
  </g>
</svg>
